# Example production config for serving the built site from the domain root.
# Build with: BASE_PATH=/ npm run build, then copy dist/ to /var/www/iowa-voter-match
server {
  listen 80;
  server_name example.com;
  root /var/www/iowa-voter-match;
  index index.html;

  # Hashed build assets never change; cache them aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes fall back to the app shell (returns 200, unlike Pages' 404.html).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Future backend: proxy /api/ to an app server without touching the frontend.
  # location /api/ { proxy_pass http://127.0.0.1:3000; }
}
