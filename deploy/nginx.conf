# Example production config for serving the exported site from the domain root.
# Build with BASE_PATH unset (npm run build), then copy out/ to /var/www/iowa-voter-match
server {
  listen 80;
  server_name example.com;
  root /var/www/iowa-voter-match;
  index index.html;

  # Hashed build assets never change; cache them aggressively.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Every route is pre-rendered as <route>/index.html (trailingSlash: true).
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  # Future backend: proxy /api/ to an app server without touching the frontend.
  # location /api/ { proxy_pass http://127.0.0.1:3000; }
}
